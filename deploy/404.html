  <script>
    // ===== 可自主配置的重定向规则（自上而下匹配，命中第一条即跳转）=====
    // pattern 支持：字符串前缀 / 正则 / (path, search) => boolean
    // redirectTo 支持：字符串路径（自动附加当前 search）/ (path, search) => 目标路径
    // 目标可以是站内路径（/xxx）或完整 URL（https://...）
    const redirectMode = [
      {
        pattern: "/some-repo-name/some-path",
        redirectTo: "/some-repo-name/another-path"
      },
      {
        pattern: /^\/+regex-pattern\/.*$/,
        redirectTo: "/some-repo-name/another-path"
      },
      {
        pattern: (path) => path.includes("some-string"),
        redirectTo: "/some-repo-name/another-path"
      },
      {
        pattern: "/redirecting-function",
        redirectTo: (path, search) => {
          // You can use the path and search parameters to determine the redirect URL
          return "/some-repo-name/another-path" + search;
        }
      }
    ];

    window.__redirected = false;
    try {
      const path = window.location.pathname;
      const search = window.location.search;
      for (const { pattern, redirectTo } of redirectMode) {
        let matched = false;
        if (typeof pattern === "string") {
          matched = path.startsWith(pattern);
        } else if (pattern instanceof RegExp) {
          matched = pattern.test(path);
        } else if (typeof pattern === "function") {
          matched = !!pattern(path, search);
        }
        if (!matched) continue;

        const raw = typeof redirectTo === "function" ? redirectTo(path, search) : redirectTo + search;
        if (typeof raw !== "string" || !raw) break;
        const abs = /^[a-z][a-z0-9+.-]*:/i.test(raw);
        const url = new URL(abs ? raw : (raw[0] === "/" ? raw : "/" + raw), location.origin);
        // 目标即当前地址：放弃跳转避免死循环，交由 404 正文接管
        if (url.href === location.href) break;

        window.__redirected = true;
        location.replace(url.href);
        break; // 第一条命中的规则生效
      }
    } catch (e) {
      window.__redirected = false; // 规则异常时回退展示 404 正文
    }
  </script>

  <script>
    // ===== 可自主配置的站点关键词索引：title/path 用于展示与跳转，keywords 用于模糊匹配 =====
    const siteIndex = [
      { title: "首页", titleEn: "Home", path: "/", keywords: ["home", "index", "welcome", "首页", "主页", "官网", "landing"] },
      { title: "仓库列表", titleEn: "Repositories", path: "https://github.com/Yi-Jun-Wu?tab=repositories", keywords: ["repo", "repos", "repository", "repositories", "project", "projects", "code", "仓库", "项目", "代码库"] },

      { title: "关于", titleEn: "About", path: "/about/", keywords: ["about", "bio", "whoami", "introduce", "关于", "简介", "介绍"] },
      { title: "博客", titleEn: "Blog", path: "/blog/", keywords: ["blog", "post", "posts", "article", "articles", "博客", "日志", "文章"] },
      { title: "归档", titleEn: "Archives", path: "/archives/", keywords: ["archive", "archives", "history", "归档", "存档", "历史"] },
      { title: "标签", titleEn: "Tags", path: "/tags/", keywords: ["tag", "tags", "category", "categories", "label", "标签", "分类", "主题"] },
      { title: "联系", titleEn: "Contact", path: "/contact/", keywords: ["contact", "mail", "email", "reach", "联系", "邮箱", "联系方式"] }
    ];

    // ===== 以下为实现，无需改动 =====
    (function () {
      var page = document.getElementById("page");
      var shown = false;

      function show() {
        if (shown) return;
        shown = true;
        var css = document.getElementById("tpl-styles");
        var style = document.createElement("style");
        style.textContent = css.textContent;
        document.head.appendChild(style);
        page.appendChild(document.getElementById("tpl-body").content.cloneNode(true));
        page.hidden = false;
        page.classList.add("ready");
        init();
      }

      if (window.__redirected === true) {
        // 跳转已发起：正文保持不加载；若导航迟迟未提交（如 replace 失败），兜底展示
        var gone = false;
        window.addEventListener("pagehide", function () { gone = true; }, { once: true });
        setTimeout(function () { if (!gone) show(); }, 4000);
      } else {
        show();
      }

      function init() {
        var requested = location.pathname + location.search;
        document.getElementById("reqPath").textContent = requested;
        document.getElementById("year").textContent = String(new Date().getFullYear());

        var refEl = document.getElementById("referrer");
        if (document.referrer) {
          try {
            var u = new URL(document.referrer);
            var label = (u.host + u.pathname).slice(0, 90);
            refEl.appendChild(document.createTextNode("← 来自 "));
            var a = document.createElement("a");
            a.href = document.referrer;
            a.textContent = label;
            refEl.appendChild(a);
            refEl.appendChild(document.createTextNode(" · from"));
            refEl.hidden = false;
          } catch (e) { /* ignore bad referrer */ }
        }

        var copyBtn = document.getElementById("copyBtn");
        copyBtn.addEventListener("click", function () {
          function done() {
            copyBtn.textContent = "已复制 ✓";
            setTimeout(function () { copyBtn.textContent = "复制"; }, 1600);
          }
          function fallback() {
            var ta = document.createElement("textarea");
            ta.value = requested;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand("copy"); done(); } catch (e) { }
            document.body.removeChild(ta);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(requested).then(done, fallback);
          } else fallback();
        });

        // ---- 关键词索引：预处理 ----
        function safeDecode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
        function tokensOf(s) {
          return String(s).toLowerCase().split(/[^a-z0-9\u4e00-\u9fff]+/).filter(Boolean);
        }
        function lev(a, b) {
          var m = a.length, n = b.length, i, j;
          if (a === b) return 0;
          if (!m) return n;
          if (!n) return m;
          var prev = new Array(n + 1), cur = new Array(n + 1);
          for (j = 0; j <= n; j++) prev[j] = j;
          for (i = 1; i <= m; i++) {
            cur[0] = i;
            for (j = 1; j <= n; j++) {
              cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1));
            }
            var t = prev; prev = cur; cur = t;
          }
          return prev[n];
        }
        function scoreToken(q, h) {
          if (!q || !h) return 0;
          if (q === h) return 1;
          if (q.length >= 2 && h.indexOf(q) >= 0) return 0.6;
          if (h.length >= 2 && q.indexOf(h) >= 0) return 0.6;
          if (q.length >= 3 && Math.abs(q.length - h.length) <= 2 && lev(q, h) <= 2) return 0.4;
          return 0;
        }
        siteIndex.forEach(function (e) {
          e._hay = tokensOf([e.title, e.titleEn || "", e.path].concat(e.keywords).join(" "));
          e._path = String(e.path).toLowerCase();
        });
        function scoreEntry(tokens, e) {
          var best = 0;
          if (e._path === location.pathname.toLowerCase()) best = 1;
          for (var i = 0; i < tokens.length; i++) {
            var q = tokens[i];
            for (var j = 0; j < e._hay.length; j++) {
              var s = scoreToken(q, e._hay[j]);
              if (s > best) best = s;
            }
          }
          return best;
        }
        function rank(tokens) {
          if (!tokens.length) return [];
          return siteIndex
            .map(function (e) { return { e: e, s: scoreEntry(tokens, e) }; })
            .filter(function (x) { return x.s >= 0.4; })
            .sort(function (a, b) { return b.s - a.s; });
        }

        // ---- 猜测区块 ----
        var guessMain = document.getElementById("guessMain");
        var toSearch = document.getElementById("toSearch");
        var searchBlock = document.getElementById("searchBlock");
        var qInput = document.getElementById("q");
        var results = document.getElementById("results");

        function el(tag, cls, text) {
          var n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text != null) n.textContent = text;
          return n;
        }

        function renderMatch(scored) {
          guessMain.textContent = "";
          if (!scored.length) {
            toSearch.hidden = true;
            searchBlock.hidden = false;
            var p = el("p", "nomatch");
            p.appendChild(document.createTextNode("没有匹配的预设页面，试试搜索？"));
            p.appendChild(el("span", "en", "No preset match — try searching below."));
            guessMain.appendChild(p);
            qInput.focus({ preventScroll: true });
            return;
          }
          toSearch.hidden = false;
          var label = el("p", "guess-label", "你是不是想找？");
          label.appendChild(el("span", "en", "Did you mean…"));
          guessMain.appendChild(label);

          var primary = scored[0];
          if (primary.s >= 0.8) {
            var cta = el("a", "guess-cta");
            cta.href = primary.e.path;
            cta.appendChild(document.createTextNode("「" + primary.e.title + "」"));
            cta.appendChild(el("span", "en", primary.e.titleEn || ""));
            cta.appendChild(el("span", "arrow", "→"));
            guessMain.appendChild(cta);
            guessMain.appendChild(el("p", "guess-path", primary.e.path));
            searchBlock.hidden = true;
          } else {
            var chips = el("div", "chips");
            scored.slice(0, 3).forEach(function (x) {
              var chip = el("a", "chip");
              chip.href = x.e.path;
              chip.appendChild(document.createTextNode(x.e.title));
              chip.appendChild(el("span", "p", x.e.path));
              chips.appendChild(chip);
            });
            guessMain.appendChild(chips);
            searchBlock.hidden = true;
          }
        }

        function renderResults() {
          var val = qInput.value.trim();
          results.textContent = "";
          if (!val) return;
          var scored = rank(tokensOf(safeDecode(val)));
          if (!scored.length) {
            var li = el("li", "nores");
            li.appendChild(document.createTextNode("预设索引中没有结果。去 GitHub 搜索 → "));
            var a = document.createElement("a");
            a.href = "https://github.com/search?q=" + encodeURIComponent(val) + "&type=repositories";
            a.target = "_blank";
            a.rel = "noopener";
            a.textContent = "GitHub";
            li.appendChild(a);
            results.appendChild(li);
            return;
          }
          scored.slice(0, 6).forEach(function (x) {
            var li = el("li");
            var a = el("a");
            a.href = x.e.path;
            var t = el("span", "r-title", x.e.title);
            t.appendChild(el("span", "en", x.e.titleEn || ""));
            a.appendChild(t);
            a.appendChild(el("span", "r-path", x.e.path));
            li.appendChild(a);
            results.appendChild(li);
          });
        }

        toSearch.addEventListener("click", function () {
          searchBlock.hidden = false;
          qInput.focus();
        });
        qInput.addEventListener("input", renderResults);
        qInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            var first = results.querySelector("a");
            if (first) { e.preventDefault(); location.href = first.getAttribute("href"); }
          }
        });

        // 初始模糊匹配：来源 = 当前路径分段 + ?q=
        var initTokens = tokensOf(safeDecode(location.pathname));
        var qParam = null;
        try { qParam = new URLSearchParams(location.search).get("q"); } catch (e) { }
        if (qParam) initTokens = tokensOf(qParam).concat(initTokens);
        renderMatch(rank(initTokens));
        if (qParam) {
          searchBlock.hidden = false;
          qInput.value = qParam;
          renderResults();
        }

        document.addEventListener("keydown", function (e) {
          if (e.key !== "h" && e.key !== "H") return;
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          var t = e.target, tag = t && t.tagName;
          if (tag === "INPUT" || tag === "TEXTAREA" || (t && t.isContentEditable)) return;
          location.href = "/";
        });
      }
    })();
  </script>
</body>

</html>
